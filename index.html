<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mica · Energía. Estamos preparando nuestro espacio de presentación y catálogo de sesiones.">
  <title>Mica · Energía — Próximamente</title>
  <style>
    :root { color-scheme: light; --marfil: #F7F2E7; --verde: #465747; --salvia: #A8B59A; --tierra: #B99B7A; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 1.5rem; background: var(--marfil); color: var(--verde); font: 1rem/1.7 system-ui, sans-serif; }
    main { width: min(100%, 42rem); padding: clamp(1.5rem, 6vw, 4rem); border: 1px solid var(--tierra); border-radius: 12rem 12rem 0.5rem 0.5rem; text-align: center; }
    .ornament { color: var(--verde); font-size: 2rem; }
    h1 { margin: 1rem 0; font: normal clamp(2.5rem, 9vw, 4.5rem)/1.15 Georgia, serif; overflow-wrap: anywhere; }
    .status { font-size: 0.875rem; letter-spacing: 0.12em; text-transform: uppercase; }
    p { margin: 1rem auto 1.75rem; max-width: 30rem; }
    a { display: inline-block; padding: 0.8rem 1.4rem; border-radius: 0.3rem; background: var(--verde); color: var(--marfil); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 0.25em; }
    a:focus-visible { outline: 3px solid var(--verde); outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <div class="ornament" aria-hidden="true">✧</div>
    <h1>Mica · Energía</h1>
    <p class="status">Nuestro espacio está creciendo</p>
    <p>Estamos preparando la presentación de Mica y el catálogo de sesiones. Mientras tanto, podés encontrarnos en Instagram.</p>
    <a href="https://www.instagram.com/mica.energia/">Visitar Instagram</a>
  </main>
</body>
</html>
